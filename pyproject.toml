[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lexiguard"
version = "0.1.0.dev0"
description = "Private, evidence-backed legal-document triage (LexiGuard)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # PDF parsing (Apache-2.0 / BSD-3-Clause; NOT PyMuPDF)
    "pypdfium2>=4.30.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Utilities
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "python-dotenv>=1.0.1",
    "charset-normalizer>=3.3.2",
    "unicodedata2>=15.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "pip-licenses>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
